
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mycloset</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap');

:root {
  --pink:#d6aeb8;
  --deep:#a97888;
  --pale:#f8edf0;
  --cream:#fffaf6;
  --ink:#715b61;
}
* {box-sizing:border-box}
body {
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(ellipse at top,#fff 0%,transparent 65%),
    #f7eef0;
  font-family:'Noto Serif JP',serif;
}
header {
  text-align:center;
  padding:43px 15px 27px;
  background:rgba(255,250,246,.8);
  border-bottom:1px solid #ead6dc;
}
.decor {color:#c995a5;letter-spacing:7px;font-size:13px}
h1 {
  margin:10px 0 2px;
  font-family:'Cormorant Garamond',serif;
  font-size:54px;
  font-weight:500;
  letter-spacing:5px;
  color:#a97989;
}
.subtitle {font-size:9px;letter-spacing:3px;color:#b9949e}
.ribbon {font-size:22px;margin-top:12px}
main {max-width:1000px;margin:auto;padding:25px 16px 60px}
.intro {
  text-align:center;
  font-size:12px;
  line-height:2;
  margin-bottom:25px;
}
.search {
  width:100%;
  padding:13px 17px;
  border:1px solid #e5cbd3;
  border-radius:30px;
  background:#fffaf8;
  color:var(--ink);
  font-family:inherit;
  outline:none;
}
.filters {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:17px 0;
}
.filter {
  border:1px solid #e3c6ce;
  background:#fffaf8;
  color:#a47d89;
  padding:9px 15px;
  border-radius:22px;
  font-family:inherit;
  font-size:12px;
  cursor:pointer;
}
.filter.active {background:#c99eaa;color:white}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:17px;
}
.card {
  background:#fffaf7;
  border:1px solid #ead6dc;
  border-radius:13px;
  overflow:hidden;
  box-shadow:0 5px 15px #b98e9912;
}
.photo {
  width:100%;
  aspect-ratio:4/5;
  background:#f4e5e9;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#bd98a3;
  font-size:34px;
  overflow:hidden;
}
.photo img {width:100%;height:100%;object-fit:cover}
.card-content {padding:14px}
.card h3 {font-size:15px;margin:0 0 8px;font-weight:500}
.meta {font-size:10px;color:#b18a96;margin-bottom:10px}
.desc {font-size:11px;line-height:1.8;white-space:pre-wrap}
.prompt-box {
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  background:#f8eef0;
  font-size:10px;
  line-height:1.7;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.actions {display:flex;gap:7px;margin-top:12px}
.actions button {
  flex:1;
  padding:9px 5px;
  border:1px solid #dfc2cb;
  background:#fff;
  border-radius:20px;
  color:#a47786;
  font-family:inherit;
  font-size:11px;
  cursor:pointer;
}
.actions button:hover {background:#f7e9ed}
.empty {
  text-align:center;
  padding:55px 10px;
  color:#b18a96;
  font-size:13px;
  line-height:2.2;
}
footer {
  text-align:center;
  padding:25px;
  font-family:'Cormorant Garamond',serif;
  color:#b18a96;
  letter-spacing:2px;
  font-size:13px;
}
@media(max-width:500px) {
  h1 {font-size:46px}
  .grid {grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card-content {padding:10px}
  .card h3 {font-size:13px}
  .actions {flex-direction:column}
}
</style>
</head>
<body>
<header>
  <div class="decor">୨୧ ♡ ୨୧</div>
  <h1>mycloset</h1>
  <div class="subtitle">MY LITTLE DOLLCORE WARDROBE</div>
  <div class="ribbon">🎀 ♡ 🎀</div>
</header>

<main>
  <div class="intro">
    お気に入りのプロンプトを集めた、小さなクローゼット。<br>
    Choose your favorite style ♡
  </div>

  <input id="search" class="search" placeholder="⌕  お洋服・プロンプトを検索...">

  <div class="filters">
    <button class="filter active" data-category="all">ALL</button>
    <button class="filter" data-category="男の子">BOYS</button>
    <button class="filter" data-category="女の子">GIRLS</button>
    <button class="filter" data-category="共通">UNISEX</button>
    <button class="filter" data-category="favorite">♡ FAVORITES</button>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">
    ୨୧ ♡ ୨୧<br>
    まだお洋服がありません。<br>
    これから少しずつ増やしていこうね ♡
  </div>
</main>

<footer>♡ mycloset ♡</footer>

<script src="outfits.js"></script>
  <script>
// お洋服を追加するときは、この配列の中にデータを追加します。
// 画像はGitHubにアップロードした画像のURLを指定できます。
const outfits = window.outfits || [];

let category = 'all';
let favorites = JSON.parse(localStorage.getItem('mycloset-favorites') || '[]');

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const search = document.getElementById('search');

function render() {
  const word = search.value.toLowerCase();

  const list = outfits.filter(item => {
    const text = [
      item.name, item.category, item.model,
      item.description,
      ...(item.prompts || []).map(p => p.text)
    ].join(' ').toLowerCase();

    const matchWord = text.includes(word);
    const matchCategory =
      category === 'all' ||
      (category === 'favorite'
        ? favorites.includes(item.id)
        : item.category === category);

    return matchWord && matchCategory;
  });

  grid.innerHTML = '';
  empty.style.display = list.length ? 'none' : 'block';

  list.forEach(item => {
    const card = document.createElement('article');
    card.className = 'card';

    const photo = document.createElement('div');
    photo.className = 'photo';

    if (item.image) {
      const img = document.createElement('img');
      img.src = item.image;
      img.alt = item.name || 'outfit';
      img.onerror = () => { photo.textContent = '🎀'; };
      photo.appendChild(img);
    } else {
      photo.textContent = '🎀';
    }

    const content = document.createElement('div');
    content.className = 'card-content';

    const title = document.createElement('h3');
    title.textContent = item.name || 'Untitled';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${item.category || ''}  ♡  ${item.model || ''}`;

    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = item.description || '';

    content.append(title, meta, desc);

    (item.prompts || []).forEach((p, i) => {
      const promptTitle = document.createElement('div');
      promptTitle.className = 'meta';
      promptTitle.style.marginTop = '12px';
      promptTitle.textContent = p.title || `PROMPT ${i + 1}`;

      const prompt = document.createElement('div');
      prompt.className = 'prompt-box';
      prompt.textContent = p.text || '';

      const copy = document.createElement('button');
      copy.className = 'filter';
      copy.style.marginTop = '8px';
      copy.textContent = '♡ COPY PROMPT';
      copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(p.text || '');
          copy.textContent = 'COPIED ♡';
        } catch {
          copy.textContent = 'コピーできませんでした';
        }
      });

      content.append(promptTitle, prompt, copy);
    });

    const actions = document.createElement('div');
    actions.className = 'actions';

    const fav = document.createElement('button');
    fav.textContent = favorites.includes(item.id) ? '♥ FAVORITE' : '♡ FAVORITE';
    fav.addEventListener('click', () => {
      favorites = favorites.includes(item.id)
        ? favorites.filter(id => id !== item.id)
        : [...favorites, item.id];
      localStorage.setItem('mycloset-favorites', JSON.stringify(favorites));
      render();
    });

    actions.appendChild(fav);
    content.appendChild(actions);
    card.append(photo, content);
    grid.appendChild(card);
  });
}

document.querySelectorAll('.filter[data-category]').forEach(button => {
  button.addEventListener('click', () => {
    category = button.dataset.category;
    document.querySelectorAll('.filter[data-category]').forEach(b => {
      b.classList.toggle('active', b === button);
    });
    render();
  });
});

search.addEventListener('input', render);
render();
</script>
</body>
</html>
