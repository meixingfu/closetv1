<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mycloset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <span>9e</span>
        <span class="heart">♡</span>
        <span>9e</span>
      </div>
      <h1 class="main-title">mycloset</h1>
      <p class="sub-title">MY LITTLE DOLLCORE WARDROBE</p>
      <div class="bow-row">
        <span>🎀</span>
        <span class="heart">♡</span>
        <span>🎀</span>
      </div>
    </header>

    <div class="intro">
      <p>お気に入りのプロンプトを集めた、小さなクローゼット。</p>
      <p class="en">Choose your favorite style ♡</p>
    </div>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="お洋服・構図・背景を検索..." />
      </div>

      <div class="category-buttons" id="categoryButtons">
        <button class="cat-btn active" data-category="all">ALL</button>
        <button class="cat-btn" data-category="女の子">GIRLS</button>
        <button class="cat-btn" data-category="男の子">BOYS</button>
        <button class="cat-btn" data-category="共通">UNISEX</button>
        <button class="cat-btn fav" data-category="favorite">♡ FAVORITES</button>
      </div>
    </div>

    <div id="promptGrid" class="prompt-grid"></div>
    <p id="emptyMessage" class="empty-message" style="display: none;">該当するプロンプトがありません…</p>
  </div>

  <script src="outfits.js"></script>
  <script src="script.js"></script>
</body>
</html>
